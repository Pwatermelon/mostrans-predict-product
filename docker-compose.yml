services:
  emulator:
    build:
      context: .
      dockerfile: emulator/Dockerfile
    restart: unless-stopped
    ports:
      - "9000:9000"

  ml:
    build:
      context: .
      dockerfile: ml/Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      MT_ML_URL: http://ml:8001
      MT_EMULATOR_HOST: emulator
      MT_EMULATOR_PORT: "9000"
      MT_DASHBOARD_DIR: /app/dashboard
      MT_DATA_DIR: /app/data
    ports:
      - "8000:8000"
    depends_on:
      ml:
        condition: service_healthy
      emulator:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 20s

  gateway:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - ./landing:/srv/landing:ro
      - ./docs:/srv/docs:ro
      - ./VERSION:/srv/VERSION:ro
    depends_on:
      backend:
        condition: service_healthy
