<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>МосТранс Предикт — диспетчерский пульт</title>
  <meta name="theme-color" content="#c8102e" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <div class="brand-name">МосТранс <span>Предикт</span></div>
          <div class="brand-sub">10–15 мин · <span id="model-id">delay_catboost_ds</span></div>
        </div>
      </div>
      <nav class="nav-links">
        <a class="nav active" href="/">Пульт</a>
        <a class="nav" href="/stats">Статистика</a>
        <a class="nav" href="/admin">Данные</a>
      </nav>
      <div class="status-cluster">
        <div class="pill" id="mode-pill"><i class="dot"></i><span>подключение…</span></div>
        <div class="stat"><label>Latency</label><strong id="lat-ms">—</strong></div>
        <div class="stat"><label>Алерты</label><strong id="alerts-n">0</strong></div>
        <div class="stat"><label>Оператор</label><strong id="user-name">—</strong></div>
        <div class="clock" id="clock">--:--:--</div>
        <button type="button" class="nav logout-link" id="logout-btn">Выйти</button>
      </div>
    </header>

    <main class="layout">
      <section class="map-pane">
        <div id="map"></div>
        <div class="map-legend">
          <span><i class="lg green"></i>норма</span>
          <span><i class="lg yellow"></i>риск</span>
          <span><i class="lg red"></i>критично</span>
        </div>
        <div class="fleet-bar">
          <div class="fleet-filters">
            <label>Маршрут
              <select id="filter-route"><option value="">Все</option></select>
            </label>
            <label>Риск
              <select id="filter-risk">
                <option value="">Все</option>
                <option value="red">Критично</option>
                <option value="yellow">Риск</option>
                <option value="green">Норма</option>
              </select>
            </label>
          </div>
          <div class="fleet-table-wrap">
            <table class="fleet-table">
              <thead>
                <tr><th>ТС</th><th>Маршрут</th><th>Статус</th><th>Delay</th><th>Риск</th></tr>
              </thead>
              <tbody id="fleet-body"></tbody>
            </table>
          </div>
        </div>
      </section>

      <aside class="side">
        <div class="panel shrink">
          <div class="panel-head">
            <h2>Инциденты</h2>
            <span class="badge" id="inc-badge">0</span>
          </div>
          <div class="incidents" id="incidents"></div>
        </div>

        <div class="panel">
          <div class="panel-head"><h2>Сообщение водителю</h2></div>
          <div class="msg-compose">
            <select id="msg-vehicle"></select>
            <textarea id="msg-text" rows="3" placeholder="Вы опаздываете. Рекомендуем скорость …"></textarea>
            <button type="button" id="msg-send-main">Отправить</button>
            <div class="msg-hint" id="msg-hint">Выберите ТС или кликните по инциденту</div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head"><h2>What-if</h2></div>
          <div class="whatif-row">
            <select id="wf-route"></select>
            <select id="wf-extra">
              <option value="1">+1 ТС</option>
              <option value="2">+2 ТС</option>
              <option value="3">+3 ТС</option>
            </select>
            <button type="button" id="wf-run">OK</button>
          </div>
          <div class="whatif-out" id="wf-out">—</div>
        </div>

        <div class="panel grow">
          <div class="panel-head"><h2>Маршруты</h2></div>
          <div class="routes" id="routes"></div>
        </div>
      </aside>
    </main>

    <div class="drawer" id="drawer" hidden>
      <div class="drawer-card" id="drawer-card"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/auth.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
