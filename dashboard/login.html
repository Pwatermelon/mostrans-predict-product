<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Вход — МосТранс Предикт</title>
  <meta name="theme-color" content="#c8102e" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #eef0f3; --surface: #fff; --line: #d5dae3; --text: #1a1f2a;
      --muted: #5c6678; --red: #c8102e; --font: "IBM Plex Sans", sans-serif;
      --mono: "IBM Plex Mono", monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; font-family: var(--font); color: var(--text);
      background: var(--bg);
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      width: min(400px, 100%);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 28px 24px 22px;
    }
    .mark {
      width: 20px; height: 20px; background: var(--red);
      clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
      display: inline-block; vertical-align: -3px; margin-right: 8px;
    }
    .brand { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 4px; }
    .brand span { color: var(--red); }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; line-height: 1.45; }
    label { display: block; font-size: 11px; color: var(--muted); margin: 0 0 5px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    input {
      width: 100%; font: 500 14px var(--font); padding: 10px 12px; margin-bottom: 12px;
      border-radius: 4px; border: 1px solid var(--line); background: #fff; color: var(--text);
    }
    input:focus { outline: 2px solid rgba(200,16,46,.2); border-color: var(--red); }
    button.go {
      width: 100%; margin-top: 4px; padding: 11px;
      font: 600 14px var(--font); border: 0; border-radius: 4px; cursor: pointer;
      background: var(--red); color: #fff;
    }
    .err { color: var(--red); font-size: 13px; min-height: 18px; margin: 10px 0 0; }
    .hint {
      margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line);
      font-size: 12px; color: var(--muted); line-height: 1.5;
    }
    .hint code { font-family: var(--mono); font-size: 11px; background: #f0f2f5; padding: 1px 5px; border-radius: 3px; color: var(--text); }
    .roles { display: flex; gap: 6px; margin-bottom: 14px; }
    .roles button {
      flex: 1; background: #f7f8fa; color: var(--muted);
      border: 1px solid var(--line); font: 600 13px var(--font); padding: 9px; border-radius: 4px; cursor: pointer;
    }
    .roles button.on { border-color: var(--red); color: var(--red); background: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="brand"><i class="mark"></i>МосТранс <span>Предикт</span></h1>
    <p class="sub">Вход для диспетчера и водителя. Пароль демо: <code>demo</code>.</p>

    <div class="roles">
      <button type="button" class="on" id="role-d" data-login="dispatcher">Диспетчер</button>
      <button type="button" id="role-v" data-login="driver-1000">Водитель</button>
    </div>

    <form id="form">
      <label for="login">Логин</label>
      <input id="login" name="login" autocomplete="username" value="dispatcher" required />
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" value="demo" required />
      <button type="submit" class="go" id="go">Войти</button>
      <p class="err" id="err"></p>
    </form>

    <div class="hint">
      Диспетчер: <code>dispatcher</code> / <code>demo</code><br />
      Водитель: <code>driver-1000</code> … <code>driver-1011</code> / <code>demo</code>
    </div>
  </div>
  <script src="/static/auth.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const next = params.get("next") || "";

    document.querySelectorAll(".roles button").forEach((b) => {
      b.onclick = () => {
        document.querySelectorAll(".roles button").forEach((x) => x.classList.remove("on"));
        b.classList.add("on");
        document.getElementById("login").value = b.dataset.login;
      };
    });

    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById("go");
      const err = document.getElementById("err");
      err.textContent = "";
      btn.disabled = true;
      try {
        const r = await fetch("/api/v1/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            login: document.getElementById("login").value.trim(),
            password: document.getElementById("password").value,
          }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          err.textContent = data.detail || "Ошибка входа";
          return;
        }
        Auth.setSession(data.token, data.user);
        if (next && next.startsWith("/")) { location.href = next; return; }
        location.href = data.user.role === "driver" ? "/driver" : "/";
      } catch {
        err.textContent = "Сеть недоступна";
      } finally {
        btn.disabled = false;
      }
    };

    (async () => {
      if (params.get("switch") === "1") {
        Auth.clear();
        try { await fetch("/api/v1/auth/logout", { method: "POST", credentials: "same-origin" }); } catch (_) {}
        return;
      }
      if (!Auth.token()) return;
      const r = await fetch("/api/v1/auth/me", { headers: Auth.headers(), credentials: "same-origin" });
      if (!r.ok) return;
      const { user } = await r.json();
      if (next && next.startsWith("/")) location.href = next;
      else location.href = user.role === "driver" ? "/driver" : "/";
    })();
  </script>
</body>
</html>
